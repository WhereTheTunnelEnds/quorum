name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # so a run can be forced when a push-trigger is delayed or skipped

jobs:
  validate:
    # Org-level self-hosted runners. GitHub-hosted minutes are metered on private repos
    # and a billing block stops the job before it starts -- measured: two runs reported
    # "The job was not started because recent account payments have failed", with zero
    # gates executed. Self-hosted minutes are not metered, so CI stops depending on a
    # payment state.
    #
    # BOTH platforms, because the gates are shell and the two toolchains disagree.
    # docs/field-notes.md records a `tr` divergence where the documented failure does not
    # happen on GNU at all -- so a green run on one platform is not evidence about the
    # other. linux is the ARC scale set (GNU grep/sed); macos is the Mac Studio (BSD).
    strategy:
      fail-fast: false          # one platform's failure must not hide the other's result
      matrix:
        include:
          # `runner` is ours; `hosted` is the GitHub-hosted equivalent used for fork PRs.
          # Both legs exist in both worlds, so an outside contributor still gets the
          # BSD-and-GNU coverage that is the whole reason this matrix has two rows.
          - {name: linux, runner: org-runners, hosted: ubuntu-latest}
          - {name: macos, runner: mac-studio,  hosted: macos-latest}
    # Fork PRs NEVER touch the self-hosted runners.
    #
    # The self-hosted pool is a homelab Kubernetes cluster and a physical Mac Studio. On a
    # PUBLIC repository anyone can open a pull request from a fork, and that PR's workflow
    # would execute on that hardware -- which is why GitHub advises against self-hosted
    # runners on public repos at all.
    #
    # The routing below sends a PR whose head repo is not this repo to a GitHub-hosted runner.
    #
    # Be clear about what that is and is not. For `pull_request`, GitHub runs the workflow file
    # from the FORK's head branch -- so a hostile fork can simply edit `runs-on:` back to a
    # self-hosted label. The routing prevents ACCIDENTAL use of our hardware by an outside
    # contributor. It is NOT a control against a determined one, and an earlier version of this
    # comment called it one of "two independent controls", which was wrong.
    #
    # The controls that are real: `allows_public_repositories: false` on the org runner group
    # (a hard block, and the reason everything below is hosted), and requiring approval for
    # outside collaborators (real, but it depends on a human scrutinising every run forever).
    #
    # UPDATE 2026-09-09: this repository is now PUBLIC, so EVERY job runs hosted, not just
    # fork PRs. That is not a preference -- it is forced, and it is also correct:
    #
    #   - Forced: the org's Default runner group has `allows_public_repositories: false`,
    #     which is GitHub's default and a deliberate safety one. Within 40 minutes of the
    #     visibility flip, three `lint` runs sat queued (6m, 14m, 24m) against a pool that
    #     had gone back to one idle runner. Nothing was broken; the runners are simply not
    #     allowed to serve this repo any more, so the jobs would have queued forever.
    #   - Correct: public repositories get unlimited free hosted minutes, so hosted costs
    #     nothing here, while pointing a public repo at a homelab cluster and a physical
    #     Mac Studio is the risk the fork-PR routing below already existed to avoid.
    #
    # `matrix.runner` is kept so this is one line to revert if the repo goes private again.
    runs-on: ${{ matrix.hosted }}
    env:
      # tests/test-deployed-matches-repo.sh compares this repo against the plugin
      # INSTALLED on the machine. On a hosted runner nothing is deployed, so it skips.
      # The Mac Studio is a real workstation with quorum installed in ~/.claude, so
      # without this it would compare the branch under test against whatever version
      # happens to be installed and fail every branch that is not byte-identical to it.
      # Point it at an empty dir so the gate skips loudly, as it does everywhere else.
      CLAUDE_CONFIG_DIR: ${{ github.workspace }}/.ci-claude-config
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, because tests/test-history-has-no-secrets.sh scans every blob
          # ever committed -- which is what going public actually exposes. The default
          # shallow checkout gives it one commit, and it would then report "clean" having
          # examined almost nothing. It says so when shallow, but an honest vacuous check
          # is still a vacuous check. 62 commits costs nothing to fetch.
          fetch-depth: 0

      # Neither runner is a stock GitHub image, and each is short a different tool.
      - name: Prepare self-hosted runner
        shell: bash
        run: |
          mkdir -p "$CLAUDE_CONFIG_DIR"
          case "$RUNNER_OS" in
            Linux)
              # ghcr.io/actions/actions-runner is deliberately minimal -- it is NOT the
              # ubuntu-latest image. Measured: git, curl, tar, python3 and perl are
              # present; jq and shellcheck are NOT, and both are load-bearing here (jq
              # parses the manifests, shellcheck is its own gate). The runner has
              # passwordless sudo, so install rather than maintain a custom image.
              sudo apt-get update -qq
              sudo apt-get install -y -qq jq shellcheck perl
              ;;
            macOS)
              # On the SELF-HOSTED Mac the launchd service runs with
              # PATH=/usr/bin:/bin:/usr/sbin:/sbin, and Homebrew is NOT on it. Measured there
              # under that exact PATH:
              # jq, perl, python3 (3.9.6), git, curl and cmp all resolve -- and
              # shellcheck does NOT, because it exists only in /opt/homebrew/bin. An
              # interactive shell finds it and the service does not, which is precisely
              # the "works on my machine" gap CI is supposed to catch rather than inherit.
              # Harmless on a GitHub-hosted mac, where Homebrew is already on PATH and
              # shellcheck is usually preinstalled -- the install below is then a no-op.
              echo /opt/homebrew/bin >> "$GITHUB_PATH"
              export PATH="/opt/homebrew/bin:$PATH"
              command -v shellcheck >/dev/null 2>&1 || brew install shellcheck
              ;;
          esac
          # Prove they RUN, not merely that the installer exited 0 -- a missing tool here
          # makes a gate fail in a way that reads like a real violation.
          jq --version && shellcheck --version | head -2 && perl --version | sed -n 2p

      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/*.json; do
            echo "checking $f"
            jq empty "$f"
          done

      - name: Manifests name every adapter that ships
        run: |
          # The marketplace blurb is the widest-read text in the repo and the least reviewed.
          # It said "Consult and delegate to GLM, Codex, Copilot ... under three enforced
          # safety tiers" while five adapters shipped and docs/safety-model.md said, of
          # tier 2, "for two of the three the honest answer is yes, it can" write to your
          # tree. Same class as the model-panel skill describing three providers when it
          # drove five: a list that silently becomes a subset.
          #
          # Checks the user-facing DESCRIPTIONS, not the whole file -- the keywords array
          # already contains every provider name, so grepping the file would pass vacuously
          # and this gate would be decoration.
          descs=$( jq -r '.description' .claude-plugin/plugin.json
                   jq -r '.description, .plugins[].description' .claude-plugin/marketplace.json )
          fail=0
          for f in agents/*-agent.md; do
            [ -e "$f" ] || continue
            n=$(basename "$f" -agent.md)
            printf '%s' "$descs" | grep -qi "$n" \
              || { echo "ERROR: no manifest description mentions '$n', but agents/$n-agent.md ships"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "every shipped adapter is named in a manifest description"
          exit $fail

      - name: Every bash-fenced block is valid bash
        run: |
          # A ```bash block is an instruction to run something. Eight of them across agents/,
          # skills/ and docs/ did not parse -- placeholders like `<cli> --help` and
          # `timeout 120 <invocation>` read as redirections, so `bash -n` failed with
          # "syntax error near unexpected token". They are templates, not commands, and are
          # now fenced as ```text.
          #
          # This matters because the audience is a MODEL. A block labelled bash, under a
          # heading reading "Tested and working. Use these exactly.", is something it will
          # copy and run. `bash -n` on scripts/ has existed all along; the markdown -- which
          # is where every adapter's actual instructions live -- was never checked.
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          bad = tot = 0
          for f in sorted(pathlib.Path('.').rglob('*.md')):
              if '.git/' in str(f):
                  continue
              s = f.read_text()
              for m in re.finditer(r'```bash\n(.*?)```', s, re.S):
                  tot += 1
                  r = subprocess.run(['bash', '-n'], input=m.group(1),
                                     capture_output=True, text=True)
                  if r.returncode:
                      line = s[:m.start()].count('\n') + 1
                      err = (r.stderr.strip().splitlines() or [''])[0]
                      print(f"{f}:{line}: {err}")
                      bad += 1
          print(f"{tot} bash-fenced blocks checked, {bad} do not parse")
          if bad:
              print()
              print("ERROR: a ```bash block that is not valid bash. If it is a template,")
              print("       fence it as ```text so nobody -- and no model -- runs it.")
          sys.exit(1 if bad else 0)
          PY

      - name: Quorum's own commands are guarded before use
        run: |
          # `/plugin marketplace add` installs the plugin WITHOUT running scripts/install.sh,
          # so none of Quorum's own commands are on PATH on that route. Absence there does not
          # fail loudly, which is the problem: measured live with quorum-sanitize missing, the
          # GLM consult returned CODE=200, stop_reason=end_turn, TEXT="" — a real answer
          # classified as `empty`, "the model had nothing to say". A missing quorum-claude-on
          # in a delegate block is worse still: the provider never runs, the diff is clean,
          # and that reads as "no changes were needed".
          #
          # One bad instance was found by a live call. This gate found eight more of the same
          # shape, including quorum-sanitize itself in skills/model-panel/SKILL.md — missed
          # when the adapters were fixed.
          python3 - <<'PY'
          import re, pathlib, sys
          OWN = {'quorum-sanitize','prep-image','make-probe-image','quorum-claude-on',
                 'quorum-flags','quorum-status','quorum-verify','quorum-auth','quorum-setup'}
          bad = tot = 0
          # commands/ and the build-adapter TEMPLATES are in scope, not just agents and
          # skills. adapter.md.template does not end in .md, so `skills/**/*.md` never
          # matched it, and it invoked prep-image and quorum-sanitize with NO guard at
          # all -- while all five shipped adapters carried 9 to 15 guard references each.
          # Every provider added by /quorum:add-provider would have inherited the defect
          # this gate exists to prevent: the rule was applied to the adapters that
          # prompted it, and never enumerated to the thing that generates more of them.
          files = sorted(list(pathlib.Path('agents').glob('*.md')) +
                         list(pathlib.Path('skills').rglob('*.md')) +
                         list(pathlib.Path('skills').rglob('*.template')) +
                         list(pathlib.Path('commands').glob('*.md')))
          for f in files:
              s = f.read_text()
              for m in re.finditer(r'```bash\n(.*?)```', s, re.S):
                  block = m.group(1)
                  # Comments mention these commands by name; only real invocations count.
                  code = '\n'.join(l for l in block.splitlines()
                                   if not l.lstrip().startswith('#'))
                  g = re.search(r'for _q_need in ([^;]+);', code)
                  guarded = set(g.group(1).split()) if g else set()
                  body = code.replace(g.group(0), '') if g else code
                  for c in sorted(OWN):
                      if re.search(r'(^|[\s|(`$])' + re.escape(c) + r'\b', body):
                          tot += 1
                          if c not in guarded:
                              line = s[:m.start()].count('\n') + 1
                              print(f"{f}:{line}: invokes {c} with no guard")
                              bad += 1
          print(f"{tot} invocation(s) of Quorum's own commands, {bad} unguarded")
          if bad:
              print()
              print("ERROR: add a guard to the top of the block:")
              print("  for _q_need in <commands>; do")
              print("    command -v \"$_q_need\" >/dev/null 2>&1 || {")
              print("      echo \"status: error — $_q_need is not on PATH.\"; exit 1; }")
              print("  done")
          sys.exit(1 if bad else 0)
          PY

      - name: README documents every command that gets installed
        run: |
          # install.sh puts nine commands on the user's PATH. The README documented six.
          # quorum-sanitize was missing -- the one every adapter now refuses to run without --
          # along with quorum-claude-on, which is how GLM's verify and delegate tiers work at
          # all, and make-probe-image. A command a user has but cannot find out about is
          # indistinguishable from one that does not exist.
          fail=0
          tools=$(grep '^TOOLS=' scripts/install.sh | sed 's/TOOLS="//; s/"$//')
          for t in $tools; do
            grep -q -- "$t" README.md || { echo "ERROR: install.sh installs '$t' and README.md never mentions it"; fail=1; }
          done
          # And the way back out. There was no uninstall at all until an audit asked for one.
          grep -qi 'uninstall' README.md || { echo "ERROR: README.md does not say how to uninstall"; fail=1; }
          [ "$fail" = 0 ] && echo "every installed command is documented, and so is removal"
          exit $fail

      - name: Shell syntax
        run: |
          for f in scripts/* probes/*.sh; do
            case "$f" in *.md) continue;; esac
            echo "checking $f"
            bash -n "$f"
          done

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # Probe files are sourced, not executed; `qt` is provided by quorum-verify.
          # No `|| true`. A gate that cannot fail is not a gate — it is the same object
          # as a CLI that exits 0 with zero bytes, which is what this repo exists to catch.
          shellcheck -e SC2154,SC1091,SC2088,SC1090,SC2034 -S error scripts/quorum-* scripts/prep-image scripts/make-probe-image scripts/install.sh
          shellcheck -e SC2154,SC1091,SC2148,SC2034 -S error probes/*.sh
          shellcheck -e SC2154,SC1091,SC2034 -S error tests/*.sh

      - name: Test suite
        run: |
          # These tests deliberately need no credentials, no network and no vendor CLIs:
          # they force every provider unreachable and serve their own hostile fake provider.
          # That is the whole point — a suite that only runs on the author's machine is not
          # a suite, and this repo's install path has already broken twice on machines that
          # were not the author's.
          # A SKIP must fail the build. The suites skip themselves when jq or python3 is
          # absent, which is right on a contributor's laptop and WRONG here: if this image
          # ever loses one, every suite would skip, the step would exit 0, and CI would go
          # green having tested nothing. That is the same object as a canary that passes at
          # any setting, and this repo has already shipped two of those.
          ran=0
          for t in tests/*.sh; do
            [ -e "$t" ] || continue
            echo "--- $t"
            out=$(bash "$t" 2>&1) || { echo "$out"; exit 1; }
            echo "$out"
            case "$out" in
              *SKIP*) echo "ERROR: $t skipped in CI — a dependency is missing from the runner"; exit 1 ;;
            esac
            ran=$((ran+1))
          done
          [ "$ran" -gt 0 ] || { echo "ERROR: no test suite ran"; exit 1; }
          echo "$ran suite(s) ran, none skipped"

      - name: Agents and skills have valid frontmatter
        run: |
          fail=0
          # mktemp, not a fixed /tmp/fm. Two jobs sharing a runner -- a matrix, or anything
          # else running concurrently -- would read each other's frontmatter and report a
          # verdict about the wrong file. A fixed name in a shared directory is a race
          # whether or not it has lost yet.
          fm=$(mktemp)
          trap 'rm -f "$fm"' EXIT
          for f in agents/*.md skills/*/SKILL.md; do
            echo "checking $f"
            head -1 "$f" | grep -q '^---$' || { echo "  ERROR: no frontmatter"; fail=1; continue; }
            awk 'NR>1 && /^---$/{exit} NR>1{print}' "$f" > "$fm"
            grep -q '^name:' "$fm"        || { echo "  ERROR: no name:"; fail=1; }
            grep -q '^description:' "$fm" || { echo "  ERROR: no description:"; fail=1; }
          done
          exit $fail

      - name: Adapters must not hold write tools
        run: |
          # An adapter relays text from other vendors' models, which may have read
          # attacker-influenced content. Granting it Write/Edit makes it a confused deputy.
          fail=0
          for f in agents/*.md; do
            fm=$(awk 'NR>1 && /^---$/{exit} {print}' "$f")
            # A MISSING tools: line is worse than a wrong one — the agent inherits every
            # tool, Write included, and the old grep passed it silently.
            if ! printf '%s' "$fm" | grep -q '^tools:'; then
              echo "ERROR: $f declares no tools: line (inherits Write/Edit by default)"; fail=1
            elif printf '%s' "$fm" | grep -qE '^tools:.*(Write|Edit|NotebookEdit)'; then
              echo "ERROR: $f grants a write tool"; fail=1
            fi
          done
          exit $fail

      - name: No stray files (allowlist)
        run: |
          # Agent tooling (MCP servers, Claude Code, Serena) writes state into $PWD, and
          # `git add -A` sweeps it in. Four such files reached this repo before this check
          # existed — hook logs, session state with verbatim prompt text, Serena config, and
          # an MCP debug log. Content-pattern scanning missed the last one entirely, because
          # it matched no secret pattern. Auditing the FILE LIST is what catches them.
          stray=$(git ls-files \
            | grep -vE '^(agents|skills|docs|scripts|probes|commands|reference|tests|\.github|\.claude-plugin)/' \
            | grep -vE '^(\.gitignore|README\.md|LICENSE|CONTRIBUTING\.md|SECURITY\.md|AGENTS\.md|CLAUDE\.md)$' || true)
          if [ -n "$stray" ]; then
            echo "ERROR: unexpected tracked files:"; echo "$stray"; exit 1
          fi
          echo "no stray files"

      - name: Every adapter states the full envelope-framing rule
        run: |
          # Two agents were observed wrapping the whole envelope in a code fence, which
          # breaks any parser anchored on `status:` at the start of the response. The rule
          # only helps if every adapter carries it.
          #
          # The no-fence sentence alone is NOT enough, measured 2026-09-09: it says nothing
          # about a PREAMBLE, and a leading "Here's the envelope:" breaks a `status:`-anchored
          # parser exactly as a fence does. Both a haiku- and a sonnet-class adapter emitted
          # one. Adding the begin/end rules took haiku from 0 of 2 clean envelopes to 2 of 2,
          # so this gate requires BOTH halves -- the fence ban and the begin/end constraint.
          fail=0
          for f in agents/*.md; do
            grep -q 'Do not wrap the envelope in a code fence' "$f" || { echo "ERROR: $f missing the no-code-fence rule"; fail=1; }
            grep -q 'Your reply must BEGIN with' "$f" || { echo "ERROR: $f missing the begin/end framing rule"; fail=1; }
          done
          exit $fail

      - name: No absolute home paths or personal identifiers
        run: |
          # Pasting real terminal output into docs is how this repo documents things, and
          # it is also how an absolute home path reaches a public repo. Caught once, in a
          # verbatim installer quote, AFTER earlier manual scans had passed clean.
          # reference/ holds vendor --help output captured verbatim; those contain the
          # vendors' own placeholder examples (/home/user/projects) and must not be edited.
          # Generic placeholders are fine anywhere; a real-looking username is not.
          if grep -rInE '/(Users|home)/[a-z][a-z0-9_-]+' --include='*.md' --include='*.sh' \
               --include='*.yml' --include='*.json' . \
             | grep -vE '/(Users|home)/(user|you|me|username|name|someone|example)\b' ; then
            echo "ERROR: absolute home path found — use \$HOME or ~ instead"; exit 1
          fi
          echo "no absolute home paths"

      # NOTE on globs: every adapter gate uses agents/*.md, not agents/*-agent.md.
      # They match the same five files today, so the difference is invisible — which is
      # exactly the problem. An adapter added under any other name would be checked by the
      # write-tools and frontmatter gates and skipped by the delimiter one, and the CI run
      # would still be green. Same class as a canary that passes at any setting.
      - name: Every adapter neutralises the untrusted-output delimiter
        run: |
          # The delimiters are forgeable: provider output containing the closing marker
          # closes the fence early, and post-delimiter text is designated trusted. An audit
          # had a local model emit that marker on request. The rule only helps if every
          # adapter carries it.
          # Two halves, and the second was missing for as long as the first existed.
          # Substituting the marker text catches text; it does not catch an ANSI escape,
          # which edits the display without containing any of the marker's letters. \033[A
          # overwrites the line above — the adapter's own `status:` line.
          fail=0
          for f in agents/*.md; do
            grep -q 'Neutralise the delimiter' "$f" \
              || { echo "ERROR: $f missing the delimiter-neutralisation rule"; fail=1; }
            grep -q 'Strip control characters' "$f" \
              || { echo "ERROR: $f missing the control-character rule"; fail=1; }
            # Require the command to appear in an actual PIPELINE, not merely to be named.
            # The previous gate accepted the literal "LC_ALL=C tr -d" anywhere in the file,
            # and every adapter satisfied it with a fragment that had no input, no output
            # and no assignment, sitting ~100-300 lines below the capture. Meanwhile the
            # substitution half was checked only as PROSE, and an audit measured the result:
            # grep -c 'sed -e' agents/*.md returned 0 for all five. Half a MUST rule was in
            # no runnable path anywhere in the repo while this gate printed all-clear.
            grep -qE '\| *quorum-sanitize|quorum-sanitize *<' "$f" \
              || { echo "ERROR: $f never pipes anything through quorum-sanitize"; fail=1; }
          done
          # "carry the rule", not "neutralise" -- what this gate verifies is that five
          # markdown files contain three strings and one pipeline. The neutralising is
          # done by quorum-sanitize at runtime, and is tested by tests/test-sanitize.sh.
          [ "$fail" = 0 ] && echo "all adapters carry the rule AND pipe through quorum-sanitize"
          exit $fail

      - name: No API key passed on a command line
        run: |
          # `curl -H "Authorization: Bearer $KEY"` puts the key in argv, where `ps auxww`
          # shows it to every process running as the user for the whole life of the call.
          # Measured here, then fixed with a chmod 600 header file and `-H @file`.
          #
          # The first fix reached the scripts and probes but NOT the adapter and skill
          # markdown — the part a model actually copies and runs, under a heading reading
          # "Tested and working. Use these exactly." Three sites shipped insecure while the
          # repo believed the problem was solved, which is why this is a gate and not a
          # memory. Comment lines are allowed so the danger can still be explained.
          # docs/field-notes.md is excluded because its job is to quote past mistakes
          # verbatim, so it necessarily contains the pattern this gate forbids. Same
          # problem as the untrusted-output delimiter, which docs/adapter-contract.md also
          # has to spell out in full. Nothing in field-notes.md is ever executed.
          #
          # NOTE: no backticks in the messages below. The first version of this gate wrote
          # "it lands in argv and `ps` shows it" inside double quotes, and bash ran ps and
          # spliced a process list into the middle of the error.
          #
          # "Not a comment" is expressed by FILTERING matches, not by trying to encode it in
          # the search pattern. Two previous single-pattern attempts were each wrong in a
          # different direction:
          #
          #   ^[^#]*-H "Authorization: Bearer
          #     `[^#]*` cannot cross a '#', so any earlier '#' on the line hid the match --
          #     a URL fragment, a shell comment after the command. It also escaped matching
          #     its own definition only by accident, because the pattern contains a literal
          #     '#'; reformatting this line would have turned the gate red against itself.
          #
          #   ^[[:space:]]*[^#[:space:]].*-H "Authorization: Bearer
          #     the leading [^#[:space:]] consumes the '-' of '-H', leaving nothing for the
          #     rest of the pattern -- so the ordinary indented `  -H "Auth...` form, which
          #     is the form actually written in every adapter, was missed entirely. Measured:
          #     it did not fire on a real violation appended to agents/ollama-agent.md.
          #
          # So: match the dangerous text plainly, then drop the hits whose line begins with a
          # comment marker, using grep -n's own file:line: prefix as the anchor. The two
          # concerns stay separate and neither can break the other.
          #
          # lint.yml excludes itself: the pattern above is text in this file and matches, and
          # nothing here is executed as a curl invocation.
          # -e, not --. The pattern begins with a '-', so it needs introducing as a pattern;
          # `--` looks like it does that but it ends OPTION parsing entirely, which turns
          # every following --include/--exclude into a filename. Measured: five
          # "No such file or directory" errors and an unfiltered search that matched
          # field-notes.md, i.e. a gate that is red no matter what the tree contains.
          if grep -rnE -e '-H "Authorization: Bearer' \
               --include='*.md' --include='*.sh' --include='*.yml' \
               --exclude=field-notes.md --exclude=lint.yml . \
             | grep -vE '^[^:]*:[0-9]+:[[:space:]]*#' ; then
            echo
            echo 'ERROR: API key on a curl command line - it lands in argv, where ps shows it.'
            echo '       Use: -H @<(printf %s "Authorization: Bearer %s\n" "$KEY")'
            exit 1
          fi
          echo "no API keys on command lines"

      - name: No API key written to a file
        run: |
          # The companion to the gate above, and the reason it is needed.
          #
          # That gate forces the key OUT of argv and, as written, forced it INTO a file:
          # `chmod 600` mktemp plus `-H @file`. Nothing then forced it back out. Removal was
          # a convention -- `trap 'rm -f "$_hdr"' EXIT INT TERM HUP` -- and a convention
          # applies only where someone remembers it. Four of seven sites did not:
          #
          #   probes/glm.sh                      no trap at all; the window spans curl -m 900
          #   skills/model-panel/SKILL.md        $HDR created AFTER the trap, never added to
          #                                      it, so three harmless files were cleaned and
          #                                      the one holding the key was not
          #   docs/porting/openai-compatible.md  rm -f only -- and it is the copy-me template
          #   agents/glm-agent.md (2nd snippet)  rm -f only
          #
          # Measured, SIGTERM'd mid-call with a sentinel key: one file per interrupted run,
          # mode 600, holding a live credential, surviving indefinitely. Earlier, before any
          # trap existed, two independent audits counted 110 and 241 such files on the
          # author's machine -- 130 of 130 runs -- outliving key rotation, landing in
          # backups, and on Linux sitting in /tmp until systemd-tmpfiles ages them out.
          #
          # So the rule is not "remember the trap". It is "there is no file": curl reads the
          # header from `-H @<(...)`, a /dev/fd pipe. Nothing to strand, nothing to
          # remember, and this gate is what the trap convention never had.
          #
          # Anchored on the REDIRECT, not on the header text, so prose and comments that
          # merely name the old pattern do not trip it -- the same false-positive trap that
          # made three earlier versions of the argv gate unusable. Note `.*` and not
          # `[^\n]*`: in ERE a bracket expression takes \ and n literally, so `[^\n]*` cannot
          # cross the `%s\n` that every one of these lines contains, and the gate silently
          # matched nothing. Measured: it passed against all seven live violations.
          #
          # Same exclusions as above, for the same reasons: field-notes.md quotes past
          # mistakes verbatim, and lint.yml contains this pattern as text. tests/ is NOT
          # excluded -- tests/test-key-never-on-disk.sh plants a violation to prove this
          # gate can go red, and it assembles the forbidden literal from two halves so it
          # never appears whole, exactly as tests/test-lint-gates.sh does for the argv gate.
          # Excluding the file instead would blind this gate to a real violation written
          # there later.
          if grep -rnE -e 'Authorization: Bearer.*>[[:space:]]*"?\$' \
               --include='*.md' --include='*.sh' --include='*.yml' \
               --exclude=field-notes.md --exclude=lint.yml . \
             | grep -vE '^[^:]*:[0-9]+:[[:space:]]*#' ; then
            echo
            echo 'ERROR: API key written to a file - a signal before the cleanup strands it.'
            echo '       Use: -H @<(printf %s "Authorization: Bearer %s\n" "$KEY")'
            echo '       See tests/test-key-never-on-disk.sh'
            exit 1
          fi
          echo "no API keys written to files"

      - name: Canonical URLs point at files that exist
        run: |
          # agents/ and skills/ load into the USER'S project, so a relative `docs/x.md` in
          # them resolves against their working directory and finds nothing. Measured: a
          # plugin session running `ls docs/adapter-contract.md` gets "No such file or
          # directory", and CLAUDE_PLUGIN_ROOT — the documented way to reference plugin
          # files — is UNSET under --plugin-dir, so it is not a usable fallback either.
          # Those references are therefore absolute URLs. This gate keeps them honest
          # offline: the URL path must name a file that exists in this repo.
          python3 - <<'PY'
          import pathlib, re, sys
          # Strip the anchor and any trailing punctuation before resolving. `[^\s)]+` alone
          # swallows `#section` and a sentence-ending `.` or `>`, so this gate rejected
          # CORRECT content: a deep link to docs/evidence.md#reproducible, and an autolink
          # ending a sentence, both reported DANGLING. The sibling "Links to local files"
          # gate ~100 lines below already does .split('#')[0]; this one did not.
          #
          # A gate that fails on valid input is the failure mode this repo cares most about,
          # because it teaches people that red means nothing.
          pat = re.compile(r'https://github\.com/[\w-]+/quorum/blob/main/([^\s)]+)')
          def norm(t):
              return t.split('#')[0].rstrip('>.,;:!?\'"')
          bad = 0
          for f in pathlib.Path('.').rglob('*'):
              if not f.is_file() or '.git/' in str(f):
                  continue
              try:
                  text = f.read_text()
              except Exception:
                  continue
              for m in pat.finditer(text):
                  target = norm(m.group(1))
                  if target and not pathlib.Path(target).exists():
                      print(f"DANGLING {f} -> {target}")
                      bad += 1
          print("no dangling canonical URLs" if not bad else f"{bad} dangling")
          sys.exit(1 if bad else 0)
          PY

      - name: Agents and skills use no repo-relative doc references
        run: |
          # The other half: a NEW relative reference must not creep back in. Check link
          # TARGETS and backticked paths — not link labels. `[docs/x.md](https://…)` is
          # correct and its label legitimately contains the repo-relative path.
          python3 - <<'PY'
          import pathlib, re, sys
          # a markdown link whose target is a relative path into docs/
          # `[a-z-]+` could not cross a '/', and excluded digits and underscores — so
          # docs/porting/mlx.md, docs/probe3-notes.md and docs/field_notes.md all slipped
          # through. There was a LIVE violation in the tree this gate guards:
          # skills/build-adapter/SKILL.md referenced `docs/porting/` and
          # `docs/porting/openai-compatible.md` while the gate reported all clear.
          PATH_RE = r'docs/[\w./-]+\.md'
          rel_link = re.compile(r'\]\((?!https?://)[^)]*' + PATH_RE + r'[^)]*\)')
          # a backticked repo path, which reads as "open this file" — with or without a
          # trailing .md, since `docs/porting/` is the same instruction
          backticked = re.compile(r'`(?:\.{0,2}/)?docs/[\w./-]*`')
          bad = 0
          for d in ('agents', 'skills'):
              for f in pathlib.Path(d).rglob('*'):
                  if not f.is_file():
                      continue
                  try:
                      text = f.read_text()
                  except Exception:
                      continue
                  for n, line in enumerate(text.splitlines(), 1):
                      for pat in (rel_link, backticked):
                          for m in pat.finditer(line):
                              print(f"{f}:{n}: {m.group(0)}")
                              bad += 1
          if bad:
              print()
              print("ERROR: agents/ and skills/ load into the USER'S project, so a relative")
              print("       path to docs/ resolves against their working directory and finds")
              print("       nothing. Use the full https://github.com/.../blob/main/ URL.")
          else:
              print("no repo-relative doc references in agents/ or skills/")
          sys.exit(1 if bad else 0)
          PY

      - name: No command and skill share a name
        run: |
          # commands/ and skills/ auto-discover into ONE `quorum:<name>` namespace, so a
          # command and a skill with the same basename collide and the command wins.
          #
          # This shipped: `commands/add-provider.md` shadowed `skills/add-provider/`, whose
          # entire body is "Invoke the `add-provider` skill" — so the repo's flagship
          # workflow resolved to an instruction to invoke itself, and the six probes were
          # unreachable in every plugin install. Nothing in the repo could detect it,
          # because on disk both files were present and correct; only loading the plugin
          # showed one had eaten the other.
          #
          # The pattern to follow is the one the other two pairs already use by luck:
          # panel -> model-panel, delegate -> delegate-task, add-provider -> build-adapter.
          fail=0
          for c in commands/*.md; do
            [ -e "$c" ] || continue
            n=$(basename "$c" .md)
            if [ -d "skills/$n" ]; then
              echo "ERROR: commands/$n.md and skills/$n/ both resolve to quorum:$n"
              echo "       the command wins and the skill becomes unreachable — rename one"
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "no command/skill name collisions"
          exit $fail

      - name: Skill and command bodies do not delegate to themselves
        run: |
          # The other half of the same bug: a command whose body says "invoke the <X> skill"
          # is broken if <X> is the command's own name, whether or not a directory collides.
          fail=0
          for c in commands/*.md; do
            [ -e "$c" ] || continue
            n=$(basename "$c" .md)
            if grep -qE "[Ii]nvoke the \`?$n\`? skill" "$c"; then
              echo "ERROR: $c tells the model to invoke a skill named '$n' — itself"
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "no self-referential commands"
          exit $fail

      - name: Skills named by a command actually exist
        run: |
          # A command pointing at a skill that was renamed or never existed fails silently
          # at runtime: the model is told to invoke something, finds nothing, and improvises.
          fail=0
          for c in commands/*.md; do
            [ -e "$c" ] || continue
            for s in $(grep -oE "[Ii]nvoke the \`[a-z0-9-]+\` skill" "$c" | grep -oE '`[a-z0-9-]+`' | tr -d '`'); do
              if [ ! -d "skills/$s" ]; then
                echo "ERROR: $c names skill '$s', but skills/$s/ does not exist"
                fail=1
              fi
            done
          done
          [ "$fail" = 0 ] && echo "every skill named by a command exists"
          exit $fail

      - name: Links to local files resolve
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          bad = 0
          for f in pathlib.Path('.').rglob('*.md'):
              if '.git/' in str(f):
                  continue
              for m in re.finditer(r'\]\(([^)\s]+\.md[^)\s]*)\)', f.read_text()):
                  link = m.group(1).split('#')[0]
                  if link.startswith(('http', 'mailto')):
                      continue
                  if not (f.parent / link).resolve().exists():
                      print(f"BROKEN {f} -> {link}")
                      bad += 1
          sys.exit(1 if bad else 0)
          PY
