name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # so a run can be forced when a push-trigger is delayed or skipped

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/*.json; do
            echo "checking $f"
            jq empty "$f"
          done

      - name: Shell syntax
        run: |
          for f in scripts/* probes/*.sh; do
            case "$f" in *.md) continue;; esac
            echo "checking $f"
            bash -n "$f"
          done

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # Probe files are sourced, not executed; `qt` is provided by quorum-verify.
          # No `|| true`. A gate that cannot fail is not a gate — it is the same object
          # as a CLI that exits 0 with zero bytes, which is what this repo exists to catch.
          shellcheck -e SC2154,SC1091,SC2088,SC1090,SC2034 -S error scripts/quorum-* scripts/prep-image scripts/make-probe-image scripts/install.sh
          shellcheck -e SC2154,SC1091,SC2148,SC2034 -S error probes/*.sh

      - name: Agents and skills have valid frontmatter
        run: |
          fail=0
          for f in agents/*.md skills/*/SKILL.md; do
            echo "checking $f"
            head -1 "$f" | grep -q '^---$' || { echo "  ERROR: no frontmatter"; fail=1; continue; }
            awk 'NR>1 && /^---$/{exit} NR>1{print}' "$f" > /tmp/fm
            grep -q '^name:' /tmp/fm        || { echo "  ERROR: no name:"; fail=1; }
            grep -q '^description:' /tmp/fm || { echo "  ERROR: no description:"; fail=1; }
          done
          exit $fail

      - name: Adapters must not hold write tools
        run: |
          # An adapter relays text from other vendors' models, which may have read
          # attacker-influenced content. Granting it Write/Edit makes it a confused deputy.
          fail=0
          for f in agents/*.md; do
            fm=$(awk 'NR>1 && /^---$/{exit} {print}' "$f")
            # A MISSING tools: line is worse than a wrong one — the agent inherits every
            # tool, Write included, and the old grep passed it silently.
            if ! printf '%s' "$fm" | grep -q '^tools:'; then
              echo "ERROR: $f declares no tools: line (inherits Write/Edit by default)"; fail=1
            elif printf '%s' "$fm" | grep -qE '^tools:.*(Write|Edit|NotebookEdit)'; then
              echo "ERROR: $f grants a write tool"; fail=1
            fi
          done
          exit $fail

      - name: No stray files (allowlist)
        run: |
          # Agent tooling (MCP servers, Claude Code, Serena) writes state into $PWD, and
          # `git add -A` sweeps it in. Four such files reached this repo before this check
          # existed — hook logs, session state with verbatim prompt text, Serena config, and
          # an MCP debug log. Content-pattern scanning missed the last one entirely, because
          # it matched no secret pattern. Auditing the FILE LIST is what catches them.
          stray=$(git ls-files \
            | grep -vE '^(agents|skills|docs|scripts|probes|commands|reference|tests|\.github|\.claude-plugin)/' \
            | grep -vE '^(\.gitignore|README\.md|LICENSE|CONTRIBUTING\.md)$' || true)
          if [ -n "$stray" ]; then
            echo "ERROR: unexpected tracked files:"; echo "$stray"; exit 1
          fi
          echo "no stray files"

      - name: Every adapter states the no-code-fence rule
        run: |
          # Two agents were observed wrapping the whole envelope in a code fence, which
          # breaks any parser anchored on `status:` at the start of the response. The rule
          # only helps if every adapter carries it.
          fail=0
          for f in agents/*-agent.md; do
            grep -q 'Do not wrap the envelope in a code fence' "$f" || { echo "ERROR: $f missing the no-code-fence rule"; fail=1; }
          done
          exit $fail

      - name: No absolute home paths or personal identifiers
        run: |
          # Pasting real terminal output into docs is how this repo documents things, and
          # it is also how an absolute home path reaches a public repo. Caught once, in a
          # verbatim installer quote, AFTER earlier manual scans had passed clean.
          # reference/ holds vendor --help output captured verbatim; those contain the
          # vendors' own placeholder examples (/home/user/projects) and must not be edited.
          # Generic placeholders are fine anywhere; a real-looking username is not.
          if grep -rInE '/(Users|home)/[a-z][a-z0-9_-]+' --include='*.md' --include='*.sh' \
               --include='*.yml' --include='*.json' . \
             | grep -vE '/(Users|home)/(user|you|me|username|name|someone|example)\b' ; then
            echo "ERROR: absolute home path found — use \$HOME or ~ instead"; exit 1
          fi
          echo "no absolute home paths"

      - name: Every adapter neutralises the untrusted-output delimiter
        run: |
          # The delimiters are forgeable: provider output containing the closing marker
          # closes the fence early, and post-delimiter text is designated trusted. An audit
          # had a local model emit that marker on request. The rule only helps if every
          # adapter carries it.
          fail=0
          for f in agents/*-agent.md; do
            grep -q 'Neutralise the delimiter' "$f" || { echo "ERROR: $f missing the delimiter-neutralisation rule"; fail=1; }
          done
          exit $fail

      - name: No command and skill share a name
        run: |
          # commands/ and skills/ auto-discover into ONE `quorum:<name>` namespace, so a
          # command and a skill with the same basename collide and the command wins.
          #
          # This shipped: `commands/add-provider.md` shadowed `skills/add-provider/`, whose
          # entire body is "Invoke the `add-provider` skill" — so the repo's flagship
          # workflow resolved to an instruction to invoke itself, and the six probes were
          # unreachable in every plugin install. Nothing in the repo could detect it,
          # because on disk both files were present and correct; only loading the plugin
          # showed one had eaten the other.
          #
          # The pattern to follow is the one the other two pairs already use by luck:
          # panel -> model-panel, delegate -> delegate-task, add-provider -> build-adapter.
          fail=0
          for c in commands/*.md; do
            [ -e "$c" ] || continue
            n=$(basename "$c" .md)
            if [ -d "skills/$n" ]; then
              echo "ERROR: commands/$n.md and skills/$n/ both resolve to quorum:$n"
              echo "       the command wins and the skill becomes unreachable — rename one"
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "no command/skill name collisions"
          exit $fail

      - name: Skill and command bodies do not delegate to themselves
        run: |
          # The other half of the same bug: a command whose body says "invoke the <X> skill"
          # is broken if <X> is the command's own name, whether or not a directory collides.
          fail=0
          for c in commands/*.md; do
            [ -e "$c" ] || continue
            n=$(basename "$c" .md)
            if grep -qE "[Ii]nvoke the \`?$n\`? skill" "$c"; then
              echo "ERROR: $c tells the model to invoke a skill named '$n' — itself"
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "no self-referential commands"
          exit $fail

      - name: Skills named by a command actually exist
        run: |
          # A command pointing at a skill that was renamed or never existed fails silently
          # at runtime: the model is told to invoke something, finds nothing, and improvises.
          fail=0
          for c in commands/*.md; do
            [ -e "$c" ] || continue
            for s in $(grep -oE "[Ii]nvoke the \`[a-z0-9-]+\` skill" "$c" | grep -oE '`[a-z0-9-]+`' | tr -d '`'); do
              if [ ! -d "skills/$s" ]; then
                echo "ERROR: $c names skill '$s', but skills/$s/ does not exist"
                fail=1
              fi
            done
          done
          [ "$fail" = 0 ] && echo "every skill named by a command exists"
          exit $fail

      - name: Links to local files resolve
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          bad = 0
          for f in pathlib.Path('.').rglob('*.md'):
              if '.git/' in str(f):
                  continue
              for m in re.finditer(r'\]\(([^)\s]+\.md[^)\s]*)\)', f.read_text()):
                  link = m.group(1).split('#')[0]
                  if link.startswith(('http', 'mailto')):
                      continue
                  if not (f.parent / link).resolve().exists():
                      print(f"BROKEN {f} -> {link}")
                      bad += 1
          sys.exit(1 if bad else 0)
          PY
